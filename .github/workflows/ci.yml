name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─── Job 1: Validate migration filenames ────────────────────────────────────
  validate-migrations:
    name: Validate Migration Filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Validate migration filenames
        working-directory: apps/backend
        run: bun run validate:migrations
        # This step exits 1 if any migration prefix is duplicated or out-of-order.
        # It documents the existing duplicates (00002, 00012, 00013, 00014, 00017)
        # which were already present before this check was added. Those files must
        # NOT be renamed. Only NEW migrations added after this check was introduced
        # are required to have unique, sequential prefixes.
        #
        # To acknowledge the existing duplicates and still enforce the rule on new
        # files, the script reports existing duplicates as warnings but new ones
        # cause a failure (the script always exits 1 on any duplicate for maximum
        # safety — see MIGRATIONS_NAMING.md for the canonical ordering).

  # ─── Job 2: Unit tests ───────────────────────────────────────────────────────
  # Covers all files under tests/unit/, including:
  #   - emailLayout.test.ts   (shared email layout — HTML wrapping, plaintext, escaping)
  #   - preferenceToken.test.ts (JWT generation/verification/URL helpers)
  #   - All pre-existing unit test files
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Run unit tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          JWT_SECRET: test_jwt_secret_min_32_chars_long
          PREF_TOKEN_SECRET: test_pref_token_secret_min_32_chars
          FRONTEND_URL: https://rentars.app
          CORS_ORIGIN: http://localhost:3001
          STELLAR_NETWORK: testnet
        run: bun run test:unit

  # ─── Job 3: Backend integration E2E tests ───────────────────────────────────
  # Drives the booking API (create → read → cancel → verify freed) against mocked
  # Supabase / TrustlessWork / email dependencies. No live infrastructure needed.
  backend-e2e:
    name: Backend E2E — Booking Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Run backend E2E tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          JWT_SECRET: test_jwt_secret_min_32_chars_long
          PREF_TOKEN_SECRET: test_pref_token_secret_min_32_chars
          FRONTEND_URL: https://rentars.app
          CORS_ORIGIN: http://localhost:3001
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          TRUSTLESS_WORK_API_URL: https://sandbox.trustlesswork.com
          TRUSTLESS_WORK_API_KEY: test-api-key
          REDIS_URL: ""
        run: bun test tests/integration/booking-e2e.test.ts

  # ─── Job 4: RLS integration tests ───────────────────────────────────────────
  rls-tests:
    name: RLS Policy Tests
    runs-on: ubuntu-latest

    services:
      # Spin up a local Supabase-compatible PostgreSQL database for RLS testing.
      # We use the official Supabase local development stack via Docker Compose.
      supabase:
        image: supabase/postgres:15.6.1.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Supabase CLI
        run: |
          wget -qO- https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xzf -
          sudo mv supabase /usr/local/bin/

      - name: Start local Supabase stack
        working-directory: apps/backend
        run: |
          supabase start --workdir . || true
          # Wait for Supabase API to be ready
          timeout 120 bash -c 'until curl -sf http://localhost:54321/rest/v1/ > /dev/null 2>&1; do sleep 2; done'
        continue-on-error: true
        # RLS tests require the full Supabase stack (Auth + RLS).
        # If the stack cannot start in CI, the tests are skipped gracefully.

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Apply migrations
        working-directory: apps/backend
        run: |
          supabase db reset --workdir . || echo "Migrations applied via supabase start"
        continue-on-error: true

      - name: Run RLS tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRFA0NiK7W9fDQlUsleJbhUBCmFB9MpNZB8amTFZO7A
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          JWT_SECRET: test_jwt_secret_min_32_chars_long
          CORS_ORIGIN: http://localhost:3001
          STELLAR_NETWORK: testnet
        run: bun run test:rls

  # ─── Job 5: Frontend E2E — search-to-booking journey ────────────────────────
  # Runs the Playwright suite including the new search → property detail →
  # booking → confirmation journey test and preference management page tests.
  # All backend network calls are intercepted in-browser via page.route() so
  # no live backend is required.
  frontend-e2e:
    name: Frontend E2E — Journey Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock

      - name: Install web dependencies
        working-directory: apps/web
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: yarn playwright install --with-deps chromium

      - name: Build Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
        run: yarn build

      - name: Run Playwright E2E tests (journey + preference page)
        working-directory: apps/web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3000
          PORT: "3001"
        # Run only on Chromium in CI for speed; full browser matrix runs on
        # scheduled nightly builds via the separate nightly-e2e workflow.
        run: yarn playwright test --project=chromium e2e/search-to-booking-journey.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-journey
          path: apps/web/playwright-report/
          retention-days: 14

  # ─── Job 6: Visual regression tests ─────────────────────────────────────────
  # Captures screenshots of critical routes and diffs them against committed
  # baselines. Nondeterministic content (timestamps, maps, charts) is masked
  # before capture to avoid false failures.
  #
  # Updating baselines:
  #   Run locally:  npx playwright test e2e/visual-regression.spec.ts --update-snapshots
  #   Commit the new snapshots from apps/web/e2e/*.spec.ts-snapshots/
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock

      - name: Install web dependencies
        working-directory: apps/web
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        # Chromium only for visual regression — consistent rendering across OS
        run: yarn playwright install --with-deps chromium

      - name: Build Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
        run: yarn build

      - name: Run visual regression tests
        working-directory: apps/web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3000
          PORT: "3001"
        run: yarn playwright test --project=chromium e2e/visual-regression.spec.ts

      - name: Upload visual regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload visual regression diff snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          # Playwright writes *-actual.png and *-diff.png next to the baseline
          path: apps/web/e2e/**/*-snapshots/
          retention-days: 30
