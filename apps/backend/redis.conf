# Redis configuration for local development

# Bind to localhost only
bind 127.0.0.1

# Default port
port 6379

# Disable persistence in development (comment out for production)
save ""
appendonly no

# Max memory: 256 MB
#
# Rate-limit counters must NOT be evicted before their TTL expires, otherwise
# limits would be enforced inconsistently across backend instances (an evicted
# counter resets the budget and lets clients evade limits). Use `noeviction`
# so that writes fail loudly when memory is exhausted rather than silently
# dropping rate-limit keys. Rate-limit keys are always written with an expiry
# (TTL), so they are reclaimed naturally once the window passes.
#
# If you must allow eviction for other workloads sharing this instance, use
# `volatile-lru` (only keys with a TTL are eligible) and ensure every
# rate-limit key is written with an expiry. Never use `allkeys-lru` for
# rate-limit storage.
maxmemory 256mb
maxmemory-policy noeviction

# Log level
loglevel notice

# Timeout idle connections after 300s
timeout 300

# TCP keepalive
tcp-keepalive 60